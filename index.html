<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bollywood Buzz - Movie Reviews</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0b12;color:#fff;font-family:Arial,sans-serif}
header{padding:20px;background:#141420;border-bottom:1px solid #292938;position:sticky;top:0;z-index:5}
.brand{font-size:25px;font-weight:bold;color:#ff4757}
.brand span{color:white}
nav{margin-top:15px;display:flex;gap:15px;overflow:auto}
nav button{background:none;border:0;color:#bbb;font-size:14px;cursor:pointer}
nav button:hover{color:#ff4757}
.hero{padding:35px 20px;background:linear-gradient(135deg,#27102d,#111827,#41111b)}
.hero h1{font-size:32px;margin-bottom:12px}
.hero p{color:#ddd;line-height:1.5}
.hero strong{color:#ff5265}
.search{padding:20px}
.search input{width:100%;padding:15px;border-radius:12px;background:#191925;border:1px solid #333;color:white;font-size:16px}
.section{padding:5px 20px 25px}
.section h2{margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{background:#171722;border-radius:14px;overflow:hidden;border:1px solid #292938}
.card img{width:100%;height:230px;object-fit:cover;background:#222}
.info{padding:12px}
.info h3{font-size:16px;margin-bottom:7px}
.meta{font-size:12px;color:#aaa;margin-bottom:9px}
.rating{color:#ffc857;font-weight:bold;margin-bottom:8px}
.info p{font-size:13px;color:#ccc;line-height:1.5}
.reviewBtn{width:100%;padding:11px;margin-top:12px;background:#ff4757;color:white;border:0;border-radius:9px;font-weight:bold;cursor:pointer}
footer{text-align:center;padding:30px;color:#888;border-top:1px solid #292938}
.modal{display:none;position:fixed;inset:0;background:#000d;z-index:10;overflow:auto;padding:20px}
.modalbox{background:#1b1b27;padding:22px;border-radius:16px;max-width:500px;margin:30px auto}
.modalbox img{width:100%;max-height:300px;object-fit:cover;border-radius:10px}
.modalbox h2{margin:15px 0}
.modalbox p{color:#ddd;line-height:1.6;margin:10px 0}
.close{float:right;background:#ff4757;color:white;border:0;padding:8px 13px;border-radius:8px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.hero{padding:60px}.hero h1{font-size:42px}}
</style>
</head>
<body>

<header>
<div class="brand">🎬 Bollywood <span>Buzz</span></div>
<nav>
<button onclick="filterMovies('All')">All Movies</button>
<button onclick="filterMovies('Action')">Action</button>
<button onclick="filterMovies('Drama')">Drama</button>
<button onclick="filterMovies('Comedy')">Comedy</button>
<button onclick="filterMovies('Romance')">Romance</button>
</nav>
</header>

<section class="hero">
<h1>Bollywood Movies & Reviews</h1>
<p>Discover movies, explore stories and find your next favourite film.</p>
<p style="margin-top:15px"><strong>Lights. Camera. Bollywood!</strong></p>
</section>

<div class="search">
<input id="search" placeholder="🔍 Search movies or actors..." oninput="render()">
</div>

<section class="section">
<h2 id="heading">🔥 Popular Movies</h2>
<div class="grid" id="movies"></div>
</section>

<div class="modal" id="modal">
<div class="modalbox">
<button class="close" onclick="closeModal()">✕ Close</button>
<div id="details"></div>
</div>
</div>

<footer>
<p>🎬 Bollywood Buzz</p>
<p style="margin-top:8px">Made for Bollywood movie lovers ❤️</p>
</footer>

<script>
const films=[
{title:"Jawan",year:2023,genre:"Action",rating:4.5,cast:"Shah Rukh Khan, Nayanthara",desc:"A thrilling action story of a man determined to correct society's wrongs.",img:"https://image.tmdb.org/t/p/w500/jF1q5d6W3xJ9GZ3G7k8a3J8a.jpg"},
{title:"12th Fail",year:2023,genre:"Drama",rating:4.9,cast:"Vikrant Massey, Medha Shankar",desc:"An inspiring story of struggle, determination and the dream of becoming an IPS officer.",img:"https://image.tmdb.org/t/p/w500/k0Z8h5m3J1Z7b3f5X1.jpg"},
{title:"Pathaan",year:2023,genre:"Action",rating:4.2,cast:"Shah Rukh Khan, Deepika Padukone",desc:"An agent returns to protect the country from a dangerous threat.",img:"https://image.tmdb.org/t/p/w500/1x2.jpg"},
{title:"Laapataa Ladies",year:2024,genre:"Comedy",rating:4.8,cast:"Nitanshi Goel, Pratibha Ranta",desc:"Two brides get accidentally swapped on a train journey and discover their identities.",img:"https://image.tmdb.org/t/p/w500/2x2.jpg"},
{title:"Animal",year:2023,genre:"Action",rating:4.0,cast:"Ranbir Kapoor, Rashmika Mandanna",desc:"A complicated family relationship leads to a violent journey of revenge.",img:"https://image.tmdb.org/t/p/w500/3x3.jpg"},
{title:"Dangal",year:2016,genre:"Drama",rating:4.8,cast:"Aamir Khan, Fatima Sana Shaikh",desc:"A father trains his daughters to become wrestling champions.",img:"https://image.tmdb.org/t/p/w500/4x4.jpg"},
{title:"Stree 2",year:2024,genre:"Comedy",rating:4.5,cast:"Shraddha Kapoor, Rajkummar Rao",desc:"A town faces a new supernatural mystery.",img:"https://image.tmdb.org/t/p/w500/5x5.jpg"},
{title:"Brahmastra",year:2022,genre:"Action",rating:3.9,cast:"Ranbir Kapoor, Alia Bhatt",desc:"A young man discovers a world of ancient powers.",img:"https://image.tmdb.org/t/p/w500/6x6.jpg"},
{title:"Dilwale Dulhania Le Jayenge",year:1995,genre:"Romance",rating:4.9,cast:"Shah Rukh Khan, Kajol",desc:"Two young lovers try to win the hearts of their families.",img:"https://image.tmdb.org/t/p/w500/7x7.jpg"},
{title:"Zindagi Na Milegi Dobara",year:2011,genre:"Drama",rating:4.7,cast:"Hrithik Roshan, Farhan Akhtar",desc:"Three friends embark on a road trip that changes their lives.",img:"https://image.tmdb.org/t/p/w500/8x8.jpg"}
];

let current="All";

function render(){
const q=document.getElementById("search").value.toLowerCase();
const list=films.filter(f=>(current==="All"||f.genre===current)&&(f.title.toLowerCase().includes(q)||f.cast.toLowerCase().includes(q)));
document.getElementById("movies").innerHTML=list.map(f=>`
<div class="card">
<img src="${f.img}" alt="${f.title}" onerror="this.src='https://placehold.co/400x600/202030/ffffff?text='+encodeURIComponent('${f.title}')">
<div class="info">
<h3>${f.title}</h3>
<div class="meta">${f.year} • ${f.genre}</div>
<div class="rating">⭐ ${f.rating}/5</div>
<p>${f.desc}</p>
<button class="reviewBtn" onclick="openModal('${f.title.replace(/'/g,"\\'")}')">Read Review</button>
</div>
</div>`).join("");
}

function filterMovies(g){
current=g;
document.getElementById("heading").innerText=g==="All"?"🔥 Popular Movies":g+" Movies";
render();
}

function openModal(title){
const f=films.find(x=>x.title===title);
if(!f)return;
document.getElementById("details").innerHTML=`
<img src="${f.img}" onerror="this.src='https://placehold.co/400x600/202030/ffffff?text='+encodeURIComponent('${f.title}')">
<h2>${f.title}</h2>
<p><b>Year:</b> ${f.year}</p>
<p><b>Genre:</b> ${f.genre}</p>
<p><b>Cast:</b> ${f.cast}</p>
<p><b>Rating:</b> ⭐ ${f.rating}/5</p>
<p><b>Review:</b> ${f.desc}</p>`;
document.getElementById("modal").style.display="block";
}

function closeModal(){
document.getElementById("modal").style.display="none";
}

render();
</script>
</body>
</html>
