<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bollywood Buzz</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0b12;color:white;font-family:Arial,sans-serif}
header{background:#171722;padding:18px;position:sticky;top:0;z-index:3;border-bottom:1px solid #333}
.brand{font-size:25px;font-weight:bold;color:#ff5265}
.brand span{color:white}
nav{display:flex;gap:18px;overflow:auto;margin-top:16px}
nav button{border:0;background:none;color:#ddd;white-space:nowrap;font-size:15px}
.hero{padding:38px 20px;background:linear-gradient(135deg,#3a1028,#17172d,#701d31)}
.hero h1{font-size:32px;margin-bottom:12px}
.hero p{line-height:1.6;color:#eee}
.search{padding:20px}
.search input{width:100%;padding:15px;border-radius:12px;background:#191925;border:1px solid #383849;color:white;font-size:16px}
.section{padding:10px 20px 30px}
.section h2{margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{background:#191925;border:1px solid #303040;border-radius:14px;overflow:hidden}
.poster{height:240px;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;font-size:25px;font-weight:bold;letter-spacing:1px;text-shadow:0 3px 8px #000;background:linear-gradient(145deg,#41152c,#151525)}
.poster small{display:block;font-size:12px;margin-top:12px;color:#ddd}
.info{padding:13px}
.info h3{font-size:17px;margin-bottom:8px}
.meta{font-size:12px;color:#aaa;margin-bottom:8px}
.rating{color:#ffc857;font-weight:bold;margin-bottom:10px}
.info p{font-size:13px;color:#ccc;line-height:1.5}
.reviewBtn{width:100%;padding:11px;margin-top:12px;background:#ff4757;color:white;border:0;border-radius:9px;font-weight:bold}
.modal{display:none;position:fixed;inset:0;background:#000d;z-index:10;overflow:auto;padding:20px}
.modalbox{background:#1b1b27;padding:22px;border-radius:16px;max-width:500px;margin:30px auto}
.modalbox h2{margin:15px 0}
.modalbox p{color:#ddd;line-height:1.6;margin:10px 0}
.close{float:right;background:#ff4757;color:white;border:0;padding:9px;border-radius:8px}
footer{text-align:center;padding:30px;color:#888}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header>
<div class="brand">🎬 Bollywood <span>Buzz</span></div>
<nav>
<button onclick="filter('All')">All Movies</button>
<button onclick="filter('Action')">Action</button>
<button onclick="filter('Drama')">Drama</button>
<button onclick="filter('Comedy')">Comedy</button>
<button onclick="filter('Romance')">Romance</button>
</nav>
</header>

<section class="hero">
<h1>Bollywood Movies & Reviews</h1>
<p>Discover movies, explore stories and find your next favourite film.</p>
<p style="margin-top:15px;color:#ff7184;font-weight:bold">Lights. Camera. Bollywood!</p>
</section>

<div class="search">
<input id="search" placeholder="🔍 Search movies or actors..." oninput="render()">
</div>

<section class="section">
<h2 id="heading">🔥 Popular Movies</h2>
<div class="grid" id="movies"></div>
</section>

<div class="modal" id="modal">
<div class="modalbox">
<button class="close" onclick="closeModal()">✕ Close</button>
<div id="details"></div>
</div>
</div>

<footer>🎬 Bollywood Buzz • Made for movie lovers ❤️</footer>

<script>
const films=[
{title:"Jawan",year:2023,genre:"Action",rating:4.5,cast:"Shah Rukh Khan, Nayanthara",desc:"A thrilling action story of a man determined to correct society's wrongs.",color:"linear-gradient(145deg,#8b1e35,#17152b)"},
{title:"12th Fail",year:2023,genre:"Drama",rating:4.9,cast:"Vikrant Massey, Medha Shankar",desc:"An inspiring story of struggle, determination and the dream of becoming an IPS officer.",color:"linear-gradient(145deg,#72522b,#201c18)"},
{title:"Pathaan",year:2023,genre:"Action",rating:4.2,cast:"Shah Rukh Khan, Deepika Padukone",desc:"An agent returns to protect the country from a dangerous threat.",color:"linear-gradient(145deg,#173c65,#111827)"},
{title:"Laapataa Ladies",year:2024,genre:"Comedy",rating:4.8,cast:"Nitanshi Goel, Pratibha Ranta",desc:"Two brides get accidentally swapped on a train journey and discover their identities.",color:"linear-gradient(145deg,#647c39,#27351e)"},
{title:"Animal",year:2023,genre:"Action",rating:4.0,cast:"Ranbir Kapoor, Rashmika Mandanna",desc:"A complicated family relationship leads to a violent journey of revenge.",color:"linear-gradient(145deg,#6c2222,#191515)"},
{title:"Dangal",year:2016,genre:"Drama",rating:4.8,cast:"Aamir Khan, Fatima Sana Shaikh",desc:"A father trains his daughters to become wrestling champions.",color:"linear-gradient(145deg,#73502a,#292016)"},
{title:"Stree 2",year:2024,genre:"Comedy",rating:4.5,cast:"Shraddha Kapoor, Rajkummar Rao",desc:"A town faces a new supernatural mystery.",color:"linear-gradient(145deg,#53306c,#171525)"},
{title:"Brahmastra",year:2022,genre:"Action",rating:3.9,cast:"Ranbir Kapoor, Alia Bhatt",desc:"A young man discovers a world of ancient powers.",color:"linear-gradient(145deg,#164e75,#301c56)"},
{title:"DDLJ",year:1995,genre:"Romance",rating:4.9,cast:"Shah Rukh Khan, Kajol",desc:"Two young lovers try to win the hearts of their families.",color:"linear-gradient(145deg,#9b6731,#40231a)"},
{title:"Zindagi Na Milegi Dobara",year:2011,genre:"Drama",rating:4.7,cast:"Hrithik Roshan, Farhan Akhtar",desc:"Three friends embark on a road trip that changes their lives.",color:"linear-gradient(145deg,#247b88,#17334a)"}
];

let current="All";

function render(){
const q=document.getElementById("search").value.toLowerCase();
const list=films.filter(f=>(current==="All"||f.genre===current)&&(f.title.toLowerCase().includes(q)||f.cast.toLowerCase().includes(q)));
document.getElementById("movies").innerHTML=list.map((f,i)=>`
<div class="card">
<div class="poster" style="background:${f.color}">
<div>🎬<br>${f.title}<small>${f.year} • BOLLYWOOD</small></div>
</div>
<div class="info">
<h3>${f.title}</h3>
<div class="meta">${f.year} • ${f.genre}</div>
<div class="rating">⭐ ${f.rating}/5</div>
<p>${f.desc}</p>
<button class="reviewBtn" onclick="openModal(${films.indexOf(f)})">Read Review</button>
</div>
</div>`).join("");
}

function filter(g){
current=g;
document.getElementById("heading").innerText=g==="All"?"🔥 Popular Movies":g+" Movies";
render();
}

function openModal(i){
const f=films[i];
document.getElementById("details").innerHTML=`
<h2>${f.title}</h2>
<p><b>Year:</b> ${f.year}</p>
<p><b>Genre:</b> ${f.genre}</p>
<p><b>Cast:</b> ${f.cast}</p>
<p><b>Rating:</b> ⭐ ${f.rating}/5</p>
<p><b>Review:</b> ${f.desc}</p>`;
document.getElementById("modal").style.display="block";
}

function closeModal(){
document.getElementById("modal").style.display="none";
}
render();
</script>
</body>
</html>
