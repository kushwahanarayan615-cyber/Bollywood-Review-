<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b10"><title>Bollywood Review</title>
<style>
:root{--bg:#0b0b10;--panel:#171720;--panel2:#20202a;--line:#2b2b36;--text:#f6f5fa;--muted:#a6a6b4;--red:#f12b45;--gold:#ffd45a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:82px}header{position:sticky;top:0;background:#0b0b10ee;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);z-index:4;padding:13px 16px}.brand{font-size:22px;font-weight:900}.brand span{color:var(--red)}.sub{color:var(--muted);font-size:12px}.wrap{max-width:1000px;margin:auto;padding:16px}.hero{border-radius:22px;min-height:240px;padding:24px;display:flex;align-items:end;background:linear-gradient(90deg,#090910f5,#09091055),url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=1400&q=85') center/cover;box-shadow:0 12px 35px #0006}.tag{background:var(--red);padding:5px 10px;border-radius:99px;font-size:12px;font-weight:800}.hero h1{font-size:34px;line-height:1.05;margin:10px 0}.hero p{color:#ddd;margin:0 0 15px}.btn{border:0;border-radius:12px;background:var(--red);color:white;font-weight:750;padding:11px 13px;cursor:pointer}.btn.secondary{background:var(--panel2);color:#eee}.btn.small{padding:8px 10px;font-size:12px}.searchrow{display:flex;gap:9px;margin:16px 0}.searchrow input{min-width:0;flex:1;background:var(--panel);border:1px solid var(--line);color:white;padding:13px;border-radius:14px;font-size:15px}.section{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px}.section h2{font-size:19px;margin:0}.section small,.meta{color:var(--muted);font-size:12px}.filters{display:flex;gap:8px;overflow:auto;padding-bottom:7px}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:#ddd;padding:9px 13px;border-radius:99px;cursor:pointer}.chip.active{background:var(--red);border-color:var(--red)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.movie{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer}.poster{height:190px;position:relative;background-size:cover;background-position:center;display:flex;align-items:end}.poster:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#111e,transparent 72%)}.rating{position:absolute;bottom:10px;left:10px;z-index:1;background:#09090bcc;padding:5px 8px;border-radius:9px;font-weight:800;color:var(--gold);font-size:13px}.movieinfo{padding:12px}.movieinfo h3{margin:0 0 4px;font-size:16px}.desc{font-size:13px;color:#c7c7d0;margin-top:8px;line-height:1.4}.actions{display:flex;gap:8px;margin-top:10px}.empty{text-align:center;padding:38px;color:var(--muted);grid-column:1/-1}.bottom{position:fixed;bottom:0;left:0;right:0;background:#111118f5;backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:5}.nav{max-width:1000px;margin:auto;display:flex;justify-content:space-around;padding:8px}.nav button{background:none;border:0;color:var(--muted);font-size:12px;padding:7px;cursor:pointer}.nav button b{display:block;font-size:19px;margin-bottom:2px}.nav button.active{color:var(--red)}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:9;overflow:auto;padding:16px}.modal.open{display:block}.modalbox{max-width:650px;margin:20px auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px}.modalbox h2{margin:5px 0 8px}.modalbox textarea{width:100%;background:#0d0d12;border:1px solid var(--line);border-radius:12px;color:white;padding:12px;margin:8px 0;font:inherit;min-height:100px}.stars button{background:none;border:0;color:#555;font-size:28px;cursor:pointer}.stars button.selected{color:var(--gold)}.review{background:#101017;border-radius:12px;padding:12px;margin:10px 0;font-size:14px}.close{float:right;background:#292933;color:white;border:0;border-radius:10px;padding:7px 11px;cursor:pointer}.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:#292933;color:white;padding:11px 16px;border-radius:12px;display:none;z-index:10}.foot{font-size:11px;color:var(--muted);text-align:center;margin:24px 0}.hide{display:none}@media(min-width:650px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.poster{height:240px}.hero{min-height:270px}}
</style></head><body>
<header><div class="brand">🎬 Bollywood <span>Review</span></div><div class="sub">Watch · Review · Discover Indian Cinema</div></header>
<main class="wrap"><section class="hero"><div><span class="tag">CINEMA, YOUR WAY</span><h1>Filmon ka asli<br>review.</h1><p>Discover · Rate · Share your opinion</p><button class="btn" onclick="setTab('movies')">Explore Movies ↗</button></div></section>
<div class="searchrow"><input id="search" placeholder="Movie ya actor search karo…" oninput="render()"><button class="btn" onclick="document.getElementById('search').focus()">⌕</button></div>
<div class="section"><h2 id="heading">Popular Movies</h2><small id="count"></small></div><div class="filters" id="filters"></div><div class="grid" id="grid"></div><div class="foot">Movie ratings are illustrative · Reviews and Watchlist are saved on this device</div></main>
<div class="bottom"><div class="nav"><button class="active" data-tab="home" onclick="setTab('home')"><b>⌂</b>Home</button><button data-tab="movies" onclick="setTab('movies')"><b>🎞</b>Movies</button><button data-tab="reviews" onclick="setTab('reviews')"><b>✍</b>Reviews</button><button data-tab="watchlist" onclick="setTab('watchlist')"><b>♡</b>Watchlist</button></div></div>
<div class="modal" id="modal"><div class="modalbox"><button class="close" onclick="closeModal()">✕</button><div id="modalcontent"></div></div></div><div class="toast" id="toast"></div>
<script>
const films=[
{id:1,title:'Jawan',year:2023,genre:'Action',rating:7.8,poster:'https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=700&q=80',desc:'A high-octane action entertainer with a social message.',cast:'Shah Rukh Khan, Nayanthara'},
{id:2,title:'12th Fail',year:2023,genre:'Drama',rating:9.0,poster:'https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&fit=crop&w=700&q=80',desc:'An inspiring story of perseverance and a second chance.',cast:'Vikrant Massey, Medha Shankar'},
{id:3,title:'Pathaan',year:2023,genre:'Action',rating:6.8,poster:'https://images.unsplash.com/photo-1478720568477-152d9b164e26?auto=format&fit=crop&w=700&q=80',desc:'A spy thriller filled with spectacle and action.',cast:'Shah Rukh Khan, Deepika Padukone'},
{id:4,title:'Laapataa Ladies',year:2024,genre:'Comedy',rating:8.5,poster:'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=700&q=80',desc:'A charming comedy-drama about identity and independence.',cast:'Nitanshi Goel, Pratibha Ranta'},
{id:5,title:'Animal',year:2023,genre:'Action',rating:6.1,poster:'https://images.unsplash.com/photo-1503095396549-807759245b35?auto=format&fit=crop&w=700&q=80',desc:'A turbulent family story with intense action.',cast:'Ranbir Kapoor, Rashmika Mandanna'},
{id:6,title:'Dangal',year:2016,genre:'Drama',rating:8.4,poster:'https://images.unsplash.com/photo-1517649763962-0c623066013b?auto=format&fit=crop&w=700&q=80',desc:'A former wrestler trains his daughters to become champions.',cast:'Aamir Khan, Fatima Sana Shaikh'},
{id:7,title:'Stree 2',year:2024,genre:'Comedy',rating:7.6,poster:'https://images.unsplash.com/photo-1509248961158-e54f6934749c?auto=format&fit=crop&w=700&q=80',desc:'A spooky town faces a new supernatural mystery.',cast:'Shraddha Kapoor, Rajkummar Rao'},
{id:8,title:'Brahmastra',year:2022,genre:'Fantasy',rating:5.9,poster:'https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=700&q=80',desc:'A young hero discovers a world of ancient powers.',cast:'Ranbir Kapoor, Alia Bhatt'},
{id:9,title:'Kalki 2898 AD',year:2024,genre:'Sci-Fi',rating:7.7,poster:'https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?auto=format&fit=crop&w=700&q=80',desc:'A futuristic epic inspired by myth and destiny.',cast:'Prabhas, Deepika Padukone'},
{id:10,title:'Shershaah',year:2021,genre:'Drama',rating:8.3,poster:'https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=700&q=80',desc:'A story of courage, sacrifice and duty.',cast:'Sidharth Malhotra, Kiara Advani'},
{id:11,title:'Bhool Bhulaiyaa 2',year:2022,genre:'Comedy',rating:6.6,poster:'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=700&q=80',desc:'Comedy and supernatural chaos in an old mansion.',cast:'Kartik Aaryan, Kiara Advani'},
{id:12,title:'Gully Boy',year:2019,genre:'Drama',rating:7.9,poster:'https://images.unsplash.com/photo-1516280440614-37939bbacd81?auto=format&fit=crop&w=700&q=80',desc:'An aspiring rapper finds his voice and his path.',cast:'Ranveer Singh, Alia Bhatt'}];
let genre='All',tab='home',stars=0,selected=null;const watch=()=>JSON.parse(localStorage.getItem('br_watch')||'[]');const reviews=()=>JSON.parse(localStorage.getItem('br_reviews')||'{}');
function filtersRender(){let gs=['All','Action','Drama','Comedy','Fantasy','Sci-Fi'];document.getElementById('filters').innerHTML=gs.map(g=>`<button class="chip ${g===genre?'active':''}" onclick="genre='${g}';render()">${g}</button>`).join('')}
function setTab(t){tab=t;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));document.getElementById('heading').textContent={home:'Popular Movies',movies:'Explore Movies',reviews:'Community Reviews',watchlist:'My Watchlist'}[t];render()}
function render(){filtersRender();let q=document.getElementById('search').value.trim().toLowerCase();let list=films.filter(f=>(genre==='All'||f.genre===genre)&&(!q||f.title.toLowerCase().includes(q)||f.cast.toLowerCase().includes(q)));if(tab==='watchlist')list=list.filter(f=>watch().includes(f.id));if(tab==='reviews')list=list.filter(f=>(reviews()[f.id]||[]).length);document.getElementById('count').textContent=list.length+' films';document.getElementById('grid').innerHTML=list.map(card).join('')||'<div class="empty">'+(tab==='watchlist'?'Watchlist khaali hai. ♡':'Koi movie nahi mili.')+'</div>';}
function card(f){return `<article class="movie" onclick="details(${f.id})"><div class="poster" style="background-image:url('${f.poster}')"><div class="rating">★ ${f.rating}/10</div></div><div class="movieinfo"><h3>${f.title}</h3><div class="meta">${f.year} · ${f.genre}</div><div class="desc">${f.desc}</div><div class="actions"><button class="btn small" onclick="event.stopPropagation();details(${f.id})">Review</button><button class="btn secondary small" onclick="event.stopPropagation();saveWatch(${f.id})">${watch().includes(f.id)?'♥ Saved':'♡ Save'}</button></div></div></article>`}
function saveWatch(id){let a=watch(),i=a.indexOf(id);if(i>=0)a.splice(i,1);else a.push(id);localStorage.setItem('br_watch',JSON.stringify(a));render();toast(i>=0?'Watchlist se hata di':'Watchlist mein add ho gayi ❤️');if(selected)details(id)}
function details(id){selected=films.find(f=>f.id===id);let r=reviews()[id]||[];stars=0;document.getElementById('modalcontent').innerHTML=`<div class="poster" style="height:220px;border-radius:14px;background-image:url('${selected.poster}')"></div><h2>${selected.title}</h2><div class="meta">${selected.year} · ${selected.genre} · ★ ${selected.rating}/10</div><p>${selected.desc}</p><p class="meta">Cast: ${selected.cast}</p><button class="btn secondary" onclick="saveWatch(${id})">${watch().includes(id)?'♥ Saved to Watchlist':'♡ Add to Watchlist'}</button><h3>Apna review likho</h3><div class="stars">${[1,2,3,4,5].map(n=>`<button onclick="pickStar(${n})" id="s${n}">★</button>`).join('')}</div><textarea id="reviewtext" placeholder="Is movie ke baare mein apni rai likho..."></textarea><button class="btn" onclick="submitReview(${id})">Submit Review</button><h3>Reviews (${r.length})</h3>${r.map(x=>`<div class="review"><b>★ ${x.stars}/5</b><p>${escapeHtml(x.text)}</p><small class="meta">${x.date}</small></div>`).join('')||'<div class="meta">Abhi koi review nahi. Pehla review tum likho!</div>'}`;document.getElementById('modal').classList.add('open')}
function pickStar(n){stars=n;for(let i=1;i<=5;i++)document.getElementById('s'+i).classList.toggle('selected',i<=n)}function submitReview(id){let t=document.getElementById('reviewtext').value.trim();if(!stars||!t){toast('Rating aur review dono likho');return}let a=reviews();a[id]=a[id]||[];a[id].unshift({stars,text:t,date:new Date().toLocaleDateString()});localStorage.setItem('br_reviews',JSON.stringify(a));toast('Review save ho gaya! ✨');details(id);render()}
function closeModal(){document.getElementById('modal').classList.remove('open')}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1800)}function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});render();
</script></body></html>
